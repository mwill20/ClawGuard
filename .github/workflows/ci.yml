name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Python tests and validation smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install local requirements
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -B -m unittest discover -s tests

      - name: Run ASI06 labeled fixture evaluation
        run: python -B scripts/evaluate_asi06.py --input examples/asi06_labeled_eval.json --expected-micro-f1 1.0 --hide-timing

      - name: Run ASI02 labeled fixture evaluation
        run: python -B scripts/evaluate_asi02.py --input examples/asi02_labeled_eval.json --expected-micro-f1 1.0 --hide-timing

      - name: Run combined detector-chain fixture evaluation
        run: python -B scripts/evaluate_combined_detectors.py --input examples/combined_labeled_eval.json --expected-micro-f1 1.0 --hide-timing

      - name: Validate telemetry sample schema
        run: python -B scripts/validate_telemetry.py --input examples/telemetry_sample.json
